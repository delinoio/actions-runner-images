name: Test exporter
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [images.json]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fixtures and Docker compatibility
        run: npm test
        env:
          RUN_DOCKER_TESTS: 'true'
      - name: Check shell syntax
        run: bash -n scripts/pull-image.sh scripts/smoke.sh
