name: Publish private Ubuntu images
on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - lib/**
      - scripts/**
      - third_party/**
      - package.json
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      os:
        description: Ubuntu images to check
        type: choice
        options: [both, '24.04', '26.04']
        default: both
      force:
        description: Rebuild unchanged versions without allowing downgrades
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-image-publication
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'delinoio/actions-runner-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm test
        env:
          RUN_DOCKER_TESTS: 'true'
      - run: bash -n scripts/pull-image.sh scripts/smoke.sh
  images:
    needs: test
    if: github.repository == 'delinoio/actions-runner-images' && github.ref == 'refs/heads/main'
    environment: registry-publish
    concurrency:
      group: private-ghcr-package
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 180
    env:
      GHCR_USERNAME: kdy1
      PUBLISH_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check hosted image and stable release
        id: source
        if: github.event_name != 'workflow_dispatch' || inputs.os == 'both' || inputs.os == matrix.os
        run: node scripts/check-source.mjs "$PUBLISH_OS"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
      - name: Follow a default Ubuntu migration without rebuilding unchanged tools
        if: steps.source.outputs.build == 'false'
        run: node scripts/reconcile-latest.mjs "$PUBLISH_OS"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Verify private package access before collecting software
        if: steps.source.outputs.build == 'true'
        run: node scripts/preflight.mjs "$PUBLISH_OS"
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Collect complete source inventory
        if: steps.source.outputs.build == 'true'
        run: node scripts/collect.mjs "$PUBLISH_OS"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stream private candidate
        if: steps.source.outputs.build == 'true'
        run: |
          sudo --preserve-env=GHCR_PUBLISH_TOKEN,GHCR_USERNAME,GITHUB_TOKEN,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageOS,ImageVersion,RUNNER_ENVIRONMENT,RUNNER_TEMP,GITHUB_WORKSPACE \
            "$(command -v node)" scripts/export.mjs "$PUBLISH_OS"
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reclaim disposable VM storage and verify candidate
        if: steps.source.outputs.build == 'true'
        run: |
          sudo --preserve-env=GHCR_PUBLISH_TOKEN,GHCR_USERNAME,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,ImageOS,ImageVersion,RUNNER_ENVIRONMENT \
            "$(command -v node)" scripts/verify.mjs "$PUBLISH_OS"
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Promote verified image and retain four releases
        if: steps.source.outputs.build == 'true'
        run: |
          sudo --preserve-env=GHCR_PUBLISH_TOKEN,GHCR_USERNAME,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageOS,ImageVersion,RUNNER_ENVIRONMENT \
            .work/control/node scripts/publish.mjs "$PUBLISH_OS"
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Record sanitized result
        if: always() && steps.source.outcome != 'skipped'
        run: |
          if test -x .work/control/node; then
            .work/control/node scripts/record-result.mjs "$PUBLISH_OS"
          else
            node scripts/record-result.mjs "$PUBLISH_OS"
          fi
        env:
          JOB_RESULT: ${{ job.status }}
      - name: Upload version reports only
        if: always() && steps.source.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-ubuntu-${{ matrix.os }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 30
  record:
    needs: [test, images]
    if: always() && needs.test.result == 'success' && github.repository == 'delinoio/actions-runner-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-ubuntu-*
          path: results
          merge-multiple: true
      - name: Commit real check and publication metadata
        run: node scripts/update-state.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
